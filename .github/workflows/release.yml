name: Release Schema

on:
    push:
        tags:
            - 'v*.*' # Matches tags like v1.0, v1.1

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Create Release
              uses: softprops/action-gh-release@v1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Ottolog Schema ${{ github.ref_name }}
                  body_path: CHANGELOG.md
                  files: |
                      schema/${{github.ref_name }}.json
